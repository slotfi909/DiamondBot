version: '3.9'

services:
  db:
    image: postgres:15.1-alpine
    restart: always
    environment:
      POSTGRES_DB: diamond
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      TZ: UTC
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: 6000
        protocol: tcp
        mode: host

volumes:
  db_data_dev:
    driver: local